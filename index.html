<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QuantBot Web</title>
<style>
:root{color-scheme:dark}body{margin:0;background:#0b0d14;color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:520px;margin:auto;padding:24px 18px 40px}.top{display:flex;justify-content:space-between;align-items:center;margin-top:12px}h1{font-size:28px;margin:0}.live{color:#40e38c;font-weight:800}.card{background:#151925;border:1px solid #252b3b;border-radius:20px;padding:20px;margin-top:18px}.label{color:#8f98ad;font-size:13px}.price{font-size:40px;font-weight:800;margin-top:8px}.feed{font-size:12px;color:#8f98ad;margin-top:8px}.signal{font-size:34px;font-weight:800;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}.small{background:#10141e;padding:16px;border-radius:16px}.value{font-size:22px;font-weight:700;margin-top:5px}.green{color:#40e38c}.red{color:#ff5d73}.yellow{color:#ffd166}.footer{text-align:center;color:#6f788c;margin-top:24px;font-size:13px}
</style>
</head>
<body>
<div class="wrap">
<div class="top"><h1>QuantBot</h1><div class="live">● LIVE</div></div>
<div class="card"><div class="label">BTC LIVE PRICE</div><div id="price" class="price">Connecting...</div><div id="feed" class="feed">Trying live market feed…</div></div>
<div class="card"><div class="label">CURRENT SIGNAL</div><div id="signal" class="signal yellow">WAIT</div><div class="grid"><div class="small"><div class="label">Bull Score</div><div id="bull" class="value green">0</div></div><div class="small"><div class="label">Bear Score</div><div id="bear" class="value red">0</div></div><div class="small"><div class="label">Short MA</div><div id="shortma" class="value">-</div></div><div class="small"><div class="label">Long MA</div><div id="longma" class="value">-</div></div></div></div>
<div class="card"><div class="label">MODE</div><div class="value">PAPER / SIGNAL ONLY</div></div>
<div class="footer">QuantBot Web v0.2 — no real-money trading</div>
</div>
<script>
const prices=[],$=id=>document.getElementById(id),priceEl=$('price'),feedEl=$('feed'),signalEl=$('signal'),bullEl=$('bull'),bearEl=$('bear'),shortEl=$('shortma'),longEl=$('longma');
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:0;
let gotLive=false, fallbackTimer=null;
function setPrice(p,source){if(!Number.isFinite(p)||p<=0)return;gotLive=true;priceEl.textContent='$'+p.toLocaleString(undefined,{minimumFractionDigits:2,maximumFractionDigits:2});feedEl.textContent='Market feed: '+source;prices.push(p);if(prices.length>300)prices.shift();analyze()}
function analyze(){if(prices.length<30){signalEl.textContent='WAIT';return}const s=avg(prices.slice(-10)),l=avg(prices.slice(-30));shortEl.textContent=s.toFixed(2);longEl.textContent=l.toFixed(2);let bull=50,bear=50,d=((s-l)/l)*100;if(d>0){let x=Math.min(40,d*100);bull+=x;bear-=x}else if(d<0){let x=Math.min(40,Math.abs(d)*100);bear+=x;bull-=x}bull=Math.max(0,Math.min(100,bull));bear=Math.max(0,Math.min(100,bear));bullEl.textContent=bull.toFixed(0);bearEl.textContent=bear.toFixed(0);signalEl.className='signal';if(bull>=65){signalEl.textContent='LONG';signalEl.classList.add('green')}else if(bear>=65){signalEl.textContent='SHORT';signalEl.classList.add('red')}else{signalEl.textContent='NO TRADE';signalEl.classList.add('yellow')}}
function connectCoinbase(){try{const ws=new WebSocket('wss://ws-feed.exchange.coinbase.com');let opened=false;ws.onopen=()=>{opened=true;feedEl.textContent='Connected — waiting for first tick…';ws.send(JSON.stringify({type:'subscribe',product_ids:['BTC-USD'],channels:['ticker']}))};ws.onmessage=e=>{try{const d=JSON.parse(e.data);if(d.type==='ticker'&&d.product_id==='BTC-USD')setPrice(Number(d.price),'Coinbase BTC/USD')}catch(_){}};ws.onerror=()=>{};ws.onclose=()=>{if(!gotLive)startFallback();else setTimeout(connectCoinbase,3000)};setTimeout(()=>{if(!gotLive){try{ws.close()}catch(_){ }startFallback()}},7000)}catch(_){startFallback()}}
async function pollFallback(){try{const r=await fetch('https://api.coingecko.com/api/v3/simple/price?ids=bitcoin&vs_currencies=usd',{cache:'no-store'});if(!r.ok)throw new Error('HTTP '+r.status);const d=await r.json();setPrice(Number(d.bitcoin.usd),'CoinGecko BTC/USD')}catch(e){if(!gotLive){priceEl.textContent='Feed unavailable';feedEl.textContent='Could not reach market-data providers. Refresh or try another network.'}}}
function startFallback(){if(fallbackTimer)return;feedEl.textContent='Live socket unavailable — using HTTPS fallback…';pollFallback();fallbackTimer=setInterval(pollFallback,5000)}
connectCoinbase();
</script>
</body>
</html>
