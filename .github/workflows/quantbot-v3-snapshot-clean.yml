name: QuantBot v3 Historical Snapshot Clean

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_v3_snapshot_clean.py'
      - '.github/workflows/quantbot-v3-snapshot-clean.yml'

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - name: Run clean snapshot validation
        run: python research_v3_snapshot_clean.py
      - name: Persist clean snapshot state
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v3_snapshot_clean.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record QuantBot v3 clean snapshot validation"
          git pull --rebase origin main
          git push origin HEAD:main
