name: QuantBot v24 Sep06 Japan Fee Lock

on:
  push:
    paths:
      - "research_v24_sep06_japan_fee_lock.py"
      - ".github/workflows/quantbot-v24-sep06-fee-lock.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install pandas numpy requests
      - name: Compile
        run: python -m py_compile research_v24_sep06_japan_fee_lock.py
      - name: Run Sep 6 24h test
        run: python research_v24_sep06_japan_fee_lock.py
      - name: Persist state
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v24_sep06_japan_fee_lock_state.json
          git diff --cached --quiet || git commit -m "Update v24 Sep06 fee-lock state"
          git push
