name: DARA v6 Sep1-8 Development
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dara_v6_context_tiered.py'
      - '.github/workflows/dara-v6-sep1-8.yml'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python dara_v6_context_tiered.py
      - run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dara_v6_sep1_8.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add DARA v6 Sep1-8 result"
          git pull --rebase origin main
          git push origin HEAD:main
