name: QuantBot v3 Cross-Venue Funding Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_v3_crossvenue.py'
      - '.github/workflows/quantbot-v3-crossvenue.yml'

permissions:
  contents: write

jobs:
  crossvenue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - name: Run cross-venue funding research
        run: python research_v3_crossvenue.py
      - name: Persist state
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v3_crossvenue_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record QuantBot v3 cross-venue funding results"
          git pull --rebase origin main
          git push origin HEAD:main
