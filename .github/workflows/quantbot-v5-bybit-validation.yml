name: QuantBot v5 Independent Bybit Validation

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_v5_bybit_validation.py'
      - '.github/workflows/quantbot-v5-bybit-validation.yml'

permissions:
  contents: write

jobs:
  bybit-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy requests
      - name: Run frozen T2 on independent Bybit spot data
        run: python research_v5_bybit_validation.py
      - name: Persist validation state
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v5_bybit_validation.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update independent Bybit T2 validation"
          git pull --rebase origin main
          git push origin HEAD:main
