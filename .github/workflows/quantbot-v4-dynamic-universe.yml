name: QuantBot v4 Dynamic Universe

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_v4_dynamic_universe.py'
      - '.github/workflows/quantbot-v4-dynamic-universe.yml'

permissions:
  contents: write

jobs:
  dynamic:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy requests
      - name: Run dynamic-universe audit
        run: python research_v4_dynamic_universe.py
      - name: Persist dynamic state
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v4_dynamic_universe.json
          if git diff --cached --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "Record QuantBot v4 dynamic universe audit"
          git pull --rebase origin main
          git push origin HEAD:main
