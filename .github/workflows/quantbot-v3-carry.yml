name: QuantBot v3 Structural Carry Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_v3_carry.py'
      - 'research_v3_carry_family.py'
      - 'research_v3_carry_fast_holdout.py'
      - '.github/workflows/quantbot-v3-carry.yml'

permissions:
  contents: write

jobs:
  carry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy requests
      - name: Fast audit of all frozen carry candidates on holdout
        run: python research_v3_carry_fast_holdout.py
      - name: Persist carry family state
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v3_carry_family_holdout.json
          if git diff --cached --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "Record fast QuantBot v3 carry holdout audit"
          git pull --rebase origin main
          git push origin HEAD:main
