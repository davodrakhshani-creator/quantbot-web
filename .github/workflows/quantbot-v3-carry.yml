name: QuantBot v3 Structural Carry Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_v3_carry.py'
      - '.github/workflows/quantbot-v3-carry.yml'

permissions:
  contents: write

jobs:
  carry:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy requests
      - name: Fix carry price-series index alignment
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research_v3_carry.py')
          s = p.read_text(encoding='utf-8')
          old1 = "return pd.Series(pd.to_numeric(d[4]),index=idx,name=sym).loc[lambda s:~s.index.duplicated(keep='last')].sort_index()"
          new1 = "return pd.Series(pd.to_numeric(d[4]).to_numpy(),index=pd.DatetimeIndex(idx),name=sym).loc[lambda s:~s.index.duplicated(keep='last')].sort_index()"
          old2 = "pieces.append(pd.Series(pd.to_numeric(d.iloc[:,4]),index=idx))"
          new2 = "pieces.append(pd.Series(pd.to_numeric(d.iloc[:,4]).to_numpy(),index=pd.DatetimeIndex(idx)))"
          if old1 not in s or old2 not in s:
              raise SystemExit('expected buggy price-series expressions not found')
          p.write_text(s.replace(old1,new1).replace(old2,new2),encoding='utf-8')
          PY
      - name: Run structural carry research
        run: python research_v3_carry.py
      - name: Persist carry fix and state
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add research_v3_carry.py data/v3_carry_state.json
          if git diff --cached --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "Fix carry alignment and record rerun"
          git pull --rebase origin main
          git push origin HEAD:main
