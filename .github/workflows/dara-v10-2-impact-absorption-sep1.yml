name: DARA v10.2 Impact Absorption Sep1

on:
  workflow_dispatch:
  push:
    paths:
      - 'dara_v10_2_impact_absorption_sep1.py'
      - '.github/workflows/dara-v10-2-impact-absorption-sep1.yml'

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run DARA v10.2 Sep1
        run: python dara_v10_2_impact_absorption_sep1.py
      - name: Persist result
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "quantbot@users.noreply.github.com"
          git add data/dara_v10_2_impact_absorption_sep1.json
          git diff --cached --quiet || git commit -m "Persist DARA v10.2 Sep1 result"
          git push
