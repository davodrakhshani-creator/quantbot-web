name: QuantBot v23 Futures WS L2 Paper [ARCHIVED BINANCE]

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install 'websockets>=15,<16'
      - name: Compile only
        run: python -m py_compile research_v23_futures_ws_l2.py
