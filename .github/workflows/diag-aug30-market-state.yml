name: Diagnose Aug30 Market State
on:
  push:
    paths: ['diag_aug30_market_state.py','.github/workflows/diag-aug30-market-state.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: python diag_aug30_market_state.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/diag_aug30_market_state.json
          git diff --cached --quiet || git commit -m "Persist Aug30 diagnostics"
          git push
