name: QuantBot v19 Japanese Public-Method Paper

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    concurrency:
      group: quantbot-v19-japanese-public-method-paper
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install requests
      - name: Compile
        run: python -m py_compile research_v19_japanese_clone_paper.py
      - name: Run Japanese public-method forward paper
        run: python research_v19_japanese_clone_paper.py
      - name: Persist state
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v19_japanese_clone_paper_state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update QuantBot v19 Japanese paper state"
          git pull --rebase origin main
          git push origin HEAD:main
