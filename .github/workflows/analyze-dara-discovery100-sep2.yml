name: Analyze DARA Discovery100 Sep2
on:
  push:
    paths:
      - 'analyze_dara_discovery100_sep2.py'
      - '.github/workflows/analyze-dara-discovery100-sep2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python analyze_dara_discovery100_sep2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/dara_discovery100_sep2_analysis.json
          git diff --cached --quiet || git commit -m "Persist Discovery100 Sep2 analysis"
          git push
