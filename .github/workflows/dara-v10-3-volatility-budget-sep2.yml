name: DARA v10.3 Frozen Sep2

on:
  push:
    paths:
      - 'dara_v10_3_volatility_budget_sep2.py'
      - '.github/workflows/dara-v10-3-volatility-budget-sep2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run frozen DARA v10.3 Sep2
        run: python dara_v10_3_volatility_budget_sep2.py
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dara_v10_3_volatility_budget_sep2.json
          git commit -m "Persist DARA v10.3 Sep2 result" || exit 0
          git push
