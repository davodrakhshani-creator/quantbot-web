name: DARA v16 Sep6 Capacity Displacement
on:
  push:
    paths:
      - 'dara_v16_sep6_capacity_displacement.py'
      - '.github/workflows/dara-v16-sep6-capacity-displacement.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run DARA v16 Sep6
        run: python dara_v16_sep6_capacity_displacement.py
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dara_v16_sep6_capacity_displacement.json
          git diff --cached --quiet || git commit -m "Persist DARA v16 Sep6 result"
          git push
