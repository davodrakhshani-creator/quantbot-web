name: QuantBot v12 BTC Exhaustion Reversal

on:
  push:
    paths:
      - 'research_v12_exhaustion_reversal.py'
      - '.github/workflows/quantbot-v12-exhaustion-reversal.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install numpy pandas requests
      - name: Compile
        run: python -m py_compile research_v11_microburst.py research_v12_exhaustion_reversal.py
      - name: Run v12 exhaustion reversal research
        run: python research_v12_exhaustion_reversal.py
      - name: Persist state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v12_exhaustion_reversal_state.json
          git diff --cached --quiet || git commit -m 'Update QuantBot v12 exhaustion reversal state'
          git pull --rebase origin main
          git push
