name: QuantBot v6 BTC Futures Scalper

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_v6_btc_futures_scalper.py'
      - '.github/workflows/quantbot-v6-btc-scalper.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install --disable-pip-version-check numpy pandas requests
      - name: Compile
        run: python -m py_compile research_v6_btc_futures_scalper.py
      - name: Run BTC 5m/15m scalper research
        run: python research_v6_btc_futures_scalper.py
      - name: Persist state
        run: |
          git config user.name 'quantbot-actions'
          git config user.email 'actions@users.noreply.github.com'
          git add data/v6_btc_scalper_state.json
          if ! git diff --cached --quiet; then
            git commit -m 'Update QuantBot v6 BTC futures scalper state'
            git pull --rebase origin main
            git push origin HEAD:main
          fi
