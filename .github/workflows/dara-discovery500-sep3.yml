name: DARA Discovery500 Sep3
on:
  push:
    paths:
      - 'dara_discovery500_sep3.py'
      - '.github/workflows/dara-discovery500-sep3.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run Discovery500 Sep3
        run: python dara_discovery500_sep3.py
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dara_discovery500_sep3.json
          git diff --cached --quiet || git commit -m "Persist DARA Discovery500 Sep3 result"
          git push
