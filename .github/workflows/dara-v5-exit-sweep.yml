name: DARA v5 Exit Sweep
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dara_v5_exit_sweep.py'
      - '.github/workflows/dara-v5-exit-sweep.yml'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python dara_v5_exit_sweep.py
      - run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dara_v5_exit_sweep.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add DARA v5 exit sweep result"
          git pull --rebase origin main
          git push origin HEAD:main
