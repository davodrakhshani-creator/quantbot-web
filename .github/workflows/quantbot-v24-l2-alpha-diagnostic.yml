name: QuantBot v24 L2 Alpha Diagnostic [ARCHIVED BINANCE]

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install 'websockets>=15,<16' numpy
      - name: Compile only
        run: python -m py_compile research_v24_l2_alpha_diagnostic.py
