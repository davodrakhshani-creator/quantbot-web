name: DARA Aug22 Transfer v5
on:
  push:
    paths:
      - 'dara_aug22_transfer_v5.py'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install astro dependencies
        run: pip install astronomy-engine pyswisseph
      - name: Run Aug22 frozen v5
        run: python dara_aug22_transfer_v5.py
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dara_aug22_transfer_v5.json
          git diff --cached --quiet || git commit -m "Persist Aug22 transfer v5 result"
          git pull --rebase origin main
          git push
