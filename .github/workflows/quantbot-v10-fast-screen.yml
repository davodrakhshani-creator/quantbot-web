name: QuantBot v10 Fast BTC Scalper Screen

on:
  push:
    paths:
      - 'research_v10_fast_screen.py'
      - '.github/workflows/quantbot-v10-fast-screen.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install numpy pandas requests
      - name: Compile
        run: python -m py_compile research_v10_fast_screen.py
      - name: Run v10 fast screen
        run: python research_v10_fast_screen.py
      - name: Persist state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v10_fast_screen_state.json
          git diff --cached --quiet || git commit -m 'Update QuantBot v10 fast screen state'
          git push
