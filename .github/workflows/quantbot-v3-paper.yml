name: QuantBot v3 Forward Paper Tracker

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'paper_v3_trend.py'
      - '.github/workflows/quantbot-v3-paper.yml'
  schedule:
    - cron: '25 0 * * *'

permissions:
  contents: write

concurrency:
  group: quantbot-v3-paper
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy requests
      - name: Run frozen forward paper tracker
        run: python paper_v3_trend.py
      - name: Persist paper state
        run: |
          git config user.name "quantbot-paper-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v3_paper_trend.json
          if git diff --cached --quiet; then
            echo "No paper-state change"
            exit 0
          fi
          git commit -m "Update QuantBot v3 forward paper state"
          git pull --rebase origin main
          git push origin HEAD:main
