name: QuantBot v5 Fast Signal Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_v5_fastlane.py'
      - '.github/workflows/quantbot-v5-fastlane.yml'

permissions:
  contents: write

jobs:
  fastlane:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy requests
      - name: Run fast-signal research
        run: python research_v5_fastlane.py
      - name: Persist state
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v5_fastlane_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Update QuantBot v5 fastlane state"
          git pull --rebase origin main
          git push origin HEAD:main
