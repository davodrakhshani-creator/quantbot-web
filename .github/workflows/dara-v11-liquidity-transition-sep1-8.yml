name: DARA v11 Liquidity Transition Sep1-8

on:
  push:
    paths:
      - 'dara_v11_liquidity_transition_sep1_8.py'
      - '.github/workflows/dara-v11-liquidity-transition-sep1-8.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run DARA v11 Sep1-8
        run: python dara_v11_liquidity_transition_sep1_8.py
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dara_v11_liquidity_transition_sep1_8.json
          git diff --cached --quiet || git commit -m "Persist DARA v11 Sep1-8 result"
          git push
