name: DARA v6 Blind Aug20-27
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dara_v6_blind_aug20_27.py'
      - '.github/workflows/dara-v6-blind-aug20-27.yml'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen DARA v6 blind test
        run: python dara_v6_blind_aug20_27.py
      - name: Persist result
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dara_v6_blind_aug20_27.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add DARA v6 blind Aug20-27 result"
          git pull --rebase origin main
          git push origin HEAD:main
