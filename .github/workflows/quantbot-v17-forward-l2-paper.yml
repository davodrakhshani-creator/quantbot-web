name: QuantBot v17 Forward L2 Paper

on:
  workflow_dispatch:
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    concurrency:
      group: quantbot-v17-forward-l2-paper
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install requests
      - name: Compile
        run: python -m py_compile research_v17_forward_l2_paper.py
      - name: Run forward L2 paper collector
        run: python research_v17_forward_l2_paper.py
      - name: Persist state
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v17_forward_l2_paper_state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update QuantBot v17 forward L2 paper state"
          git pull --rebase origin main
          git push origin HEAD:main
