name: QuantBot v17 Forward L2 Paper [ARCHIVED]

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install requests
      - name: Compile
        run: python -m py_compile research_v17_forward_l2_paper.py
      - name: Run archived forward L2 collector
        run: python research_v17_forward_l2_paper.py
