name: QuantBot v5 Precision Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_v5_precision.py'
      - '.github/workflows/quantbot-v5-precision.yml'

permissions:
  contents: write

jobs:
  precision:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy requests
      - name: Run v5 precision tournament
        run: python research_v5_precision.py
      - name: Persist precision state
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v5_precision_state.json
          if git diff --cached --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "Update QuantBot v5 precision state"
          git pull --rebase origin main
          git push origin HEAD:main
