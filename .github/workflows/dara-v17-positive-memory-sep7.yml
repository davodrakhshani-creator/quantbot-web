name: DARA v17 Positive Memory Sep7
on:
  push:
    paths: ['dara_v17_positive_memory_sep7.py','.github/workflows/dara-v17-positive-memory-sep7.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Run DARA v17 Positive Memory Sep7
        run: python dara_v17_positive_memory_sep7.py
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dara_v17_positive_memory_sep7.json
          git diff --cached --quiet || git commit -m "Persist DARA v17 positive-memory Sep7 result"
          git push
