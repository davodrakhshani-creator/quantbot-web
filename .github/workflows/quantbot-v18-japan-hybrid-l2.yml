name: QuantBot v18 Japan Hybrid L2 Paper

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_v18_japan_hybrid_l2.py'
      - '.github/workflows/quantbot-v18-japan-hybrid-l2.yml'
  schedule:
    - cron: '*/5 * * * *'

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    concurrency:
      group: quantbot-v18-japan-hybrid-l2
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install requests
      - name: Compile
        run: python -m py_compile research_v18_japan_hybrid_l2.py
      - name: Run Japan hybrid L2 forward paper
        run: python research_v18_japan_hybrid_l2.py
      - name: Persist state
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v18_japan_hybrid_l2_state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update QuantBot v18 Japan hybrid L2 state"
          git pull --rebase origin main
          git push origin HEAD:main
