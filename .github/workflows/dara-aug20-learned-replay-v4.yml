name: DARA Aug20 Learned Replay v4
on:
  push:
    paths:
      - 'dara_aug20_learned_replay_v4.py'
      - '.github/workflows/dara-aug20-learned-replay-v4.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install astro dependencies
        run: pip install astronomy-engine pyswisseph
      - name: Run v4
        run: python dara_aug20_learned_replay_v4.py
      - name: Persist
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dara_aug20_learned_replay_v4.json
          git diff --cached --quiet || git commit -m "Persist Aug20 learned replay v4"
          git push
