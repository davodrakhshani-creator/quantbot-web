name: DARA Discovery1000 Sep5 Exact
on:
  push:
    paths:
      - 'dara_discovery1000_sep5_exact.py'
      - '.github/workflows/dara-discovery1000-sep5-exact.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run exact Discovery1000 Sep5
        run: python dara_discovery1000_sep5_exact.py
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dara_discovery1000_sep5_exact.json
          git diff --cached --quiet || git commit -m "Persist exact Sep5 Discovery1000 result"
          git push
