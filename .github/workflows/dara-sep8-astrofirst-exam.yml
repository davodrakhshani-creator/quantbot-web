name: DARA Sep8 AstroFirst Exam
on:
  push:
    paths: ['dara_sep8_astrofirst_exam.py','.github/workflows/dara-sep8-astrofirst-exam.yml']
  workflow_dispatch:
permissions: {contents: write}
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - name: Install astro dependency
        run: pip install pyswisseph
      - name: Run Sep8 frozen exam
        run: python dara_sep8_astrofirst_exam.py
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dara_sep8_astrofirst_exam.json data/dara_sep8_astrofirst_exam_base.json
          git diff --cached --quiet || git commit -m "Persist Sep8 astro-first exam result"
          git pull --rebase origin main
          git push
