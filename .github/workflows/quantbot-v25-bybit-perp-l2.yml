name: QuantBot v25 Bybit Perp L2

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_v25_bybit_perp_l2.py'
      - '.github/workflows/quantbot-v25-bybit-perp-l2.yml'
  schedule:
    - cron: '*/10 * * * *'

permissions:
  contents: write

concurrency:
  group: quantbot-v25-bybit-perp-l2
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install 'websockets>=15,<16' numpy
      - name: Compile
        run: python -m py_compile research_v25_bybit_perp_l2.py
      - name: Run v25 Bybit perpetual L2
        run: python research_v25_bybit_perp_l2.py
      - name: Persist state
        run: |
          git config user.name 'quantbot-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/v25_bybit_perp_l2_state.json
          git diff --cached --quiet && exit 0
          git commit -m 'Update QuantBot v25 Bybit perp L2 state'
          git pull --rebase origin main
          git push origin HEAD:main
