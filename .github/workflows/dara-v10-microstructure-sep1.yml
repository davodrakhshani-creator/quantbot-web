name: DARA v10 Microstructure Sep1

on:
  push:
    paths:
      - 'dara_v10_microstructure_sep1.py'
      - '.github/workflows/dara-v10-microstructure-sep1.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run DARA v10 Sep1
        run: python dara_v10_microstructure_sep1.py
      - name: Persist result
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "quantbot-research-bot@users.noreply.github.com"
          git add data/dara_v10_microstructure_sep1.json
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "Persist DARA v10 Sep1 result"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
