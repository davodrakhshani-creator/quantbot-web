name: QuantBot v22 Japan Rare Event

on:
  workflow_dispatch:
  push:
    paths:
      - 'research_v22_japan_rare_event.py'
      - '.github/workflows/quantbot-v22-japan-rare-event.yml'

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install numpy pandas requests
      - name: Compile
        run: python -m py_compile research_v22_japan_rare_event.py
      - name: Run v22 rare-event research
        run: python research_v22_japan_rare_event.py
      - name: Persist state
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v22_japan_rare_event_state.json
          git diff --cached --quiet && exit 0
          git commit -m "Update QuantBot v22 Japan rare-event state"
          git pull --rebase origin main
          git push origin HEAD:main
