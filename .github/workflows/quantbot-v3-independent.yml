name: QuantBot v3 Independent Robustness Research

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_v3_independent.py'
      - '.github/workflows/quantbot-v3-independent.yml'

permissions:
  contents: write

concurrency:
  group: quantbot-v3-independent
  cancel-in-progress: true

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install research dependencies
        run: python -m pip install --quiet pandas numpy requests
      - name: Run locked independent research
        run: python research_v3_independent.py
      - name: Persist research state
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v3_independent_state.json
          if git diff --cached --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "Record QuantBot v3 independent robustness results"
          git pull --rebase origin main
          git push origin HEAD:main
