name: QuantBot v3 Clean Completed-Bar Rerun

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_v3_clean.py'
      - '.github/workflows/quantbot-v3-clean.yml'

permissions:
  contents: write

jobs:
  clean:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --quiet pandas numpy requests
      - name: Run clean completed-bar research
        run: python research_v3_clean.py
      - name: Persist clean state
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v3_clean_state.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record QuantBot v3 clean completed-bar results"
          git pull --rebase origin main
          git push origin HEAD:main
