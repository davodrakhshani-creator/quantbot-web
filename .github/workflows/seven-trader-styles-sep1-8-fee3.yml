name: Seven Trader Styles Sep1-8 Fee3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'seven_trader_styles_sep1_8_fee3.py'
      - '.github/workflows/seven-trader-styles-sep1-8-fee3.yml'

permissions:
  contents: write

concurrency:
  group: seven-trader-styles-sep1-8-fee3
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run Sep1-8 seven trader styles with 3x-fee profit gate
        run: python seven_trader_styles_sep1_8_fee3.py
      - name: Persist result
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seven_trader_styles_sep1_8_fee3.json
          if git diff --cached --quiet; then
            echo "No result change"
            exit 0
          fi
          git commit -m "Add Sep1-8 seven trader 3x-fee results"
          git pull --rebase origin main
          git push origin HEAD:main
