name: DARA Cleanroom Walkforward v1
on:
  push:
    paths:
      - 'dara_cleanroom_walkforward_v1.py'
      - '.github/workflows/dara-cleanroom-walkforward-v1.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install numpy pandas scikit-learn
      - name: Run clean-room walk-forward
        run: python dara_cleanroom_walkforward_v1.py
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dara_cleanroom_walkforward_v1.json
          git diff --cached --quiet || git commit -m "Persist clean-room walk-forward v1 result"
          git pull --rebase origin main
          git push
