name: Seven Trader Styles Sep1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'seven_trader_styles_sep1.py'
      - '.github/workflows/seven-trader-styles-sep1.yml'

permissions:
  contents: write

concurrency:
  group: seven-trader-styles-sep1
  cancel-in-progress: true

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run seven separate trader-style tests
        run: python seven_trader_styles_sep1.py
      - name: Persist result
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/seven_trader_styles_sep1.json
          if git diff --cached --quiet; then
            echo "No result change"
            exit 0
          fi
          git commit -m "Add seven trader style Sep1 results"
          git pull --rebase origin main
          git push origin HEAD:main
