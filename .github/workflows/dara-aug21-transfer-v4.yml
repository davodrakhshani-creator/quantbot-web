name: DARA Aug21 Transfer v4
on:
  workflow_dispatch:
  push:
    paths:
      - 'dara_aug21_transfer_v4.py'
permissions:
  contents: write
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install astro dependencies
        run: pip install astronomy-engine pyswisseph
      - name: Run Aug21 frozen v4
        run: python dara_aug21_transfer_v4.py
      - name: Persist result
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dara_aug21_transfer_v4.json
          git diff --cached --quiet || git commit -m "Persist Aug21 transfer v4 result"
          git pull --rebase origin main
          git push
