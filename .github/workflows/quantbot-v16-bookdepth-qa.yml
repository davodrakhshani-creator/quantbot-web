name: QuantBot v16 BookDepth QA

on:
  push:
    paths:
      - 'research_v16_bookdepth_qa.py'
      - '.github/workflows/quantbot-v16-bookdepth-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install numpy pandas requests
      - name: Compile
        run: python -m py_compile research_v16_bookdepth_qa.py
      - name: Run v16 QA
        run: python research_v16_bookdepth_qa.py
      - name: Persist state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v16_bookdepth_qa_state.json
          git diff --cached --quiet || git commit -m 'Update QuantBot v16 bookDepth QA state'
          git pull --rebase origin main
          git push
