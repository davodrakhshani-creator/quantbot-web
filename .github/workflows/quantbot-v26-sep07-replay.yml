name: QuantBot v26 Sep07 24h Replay
on:
  push:
    paths:
      - ".github/workflows/quantbot-v26-sep07-replay.yml"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  replay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests
      - run: python research_v26_sep07_24h_replay.py
      - name: Persist
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v26_sep07_24h_replay.json
          git diff --cached --quiet || git commit -m "Store Sep 7 24h replay result"
          git push
