name: DARA v7 Blind Jul15-Aug09
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'dara_v7_blind_jul15_aug09.py'
      - '.github/workflows/dara-v7-blind-jul15-aug09.yml'
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run frozen DARA v7 wider blind test
        run: python dara_v7_blind_jul15_aug09.py
      - name: Persist result
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/dara_v7_blind_jul15_aug09.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add DARA v7 blind Jul15-Aug09 result"
          git pull --rebase origin main
          git push origin HEAD:main
