name: QuantBot v4 Walkforward ML

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'research_v4_ml_walkforward.py'
      - '.github/workflows/quantbot-v4-ml.yml'

permissions:
  contents: write

jobs:
  ml:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install --quiet pandas numpy requests scikit-learn
      - name: Run walk-forward ML lane
        run: python research_v4_ml_walkforward.py
      - name: Persist ML state
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v4_ml_walkforward_state.json
          if git diff --cached --quiet; then
            echo "No state change"
            exit 0
          fi
          git commit -m "Record QuantBot v4 walk-forward ML results"
          git pull --rebase origin main
          git push origin HEAD:main
