name: QuantBot v13 BTC AggTrades Absorption

on:
  push:
    paths:
      - 'research_v13_aggtrade_absorption.py'
      - '.github/workflows/quantbot-v13-aggtrade-absorption.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install numpy pandas requests
      - name: Compile
        run: python -m py_compile research_v11_microburst.py research_v13_aggtrade_absorption.py
      - name: Run v13 trade-level research
        run: python research_v13_aggtrade_absorption.py
      - name: Persist state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/v13_aggtrade_absorption_state.json
          git diff --cached --quiet || git commit -m 'Update QuantBot v13 aggTrades absorption state'
          git pull --rebase origin main
          git push
