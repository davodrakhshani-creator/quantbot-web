name: DARA Discovery100 Learned Sep2
on:
  push:
    paths:
      - 'dara_discovery100_learned_sep2.py'
      - '.github/workflows/dara-discovery100-learned-sep2.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python dara_discovery100_learned_sep2.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add data/dara_discovery100_learned_sep2.json
          git diff --cached --quiet || git commit -m "Persist learned Discovery100 Sep2 result"
          git push
