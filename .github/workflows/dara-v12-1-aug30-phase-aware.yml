name: DARA v12.1 PhaseAware Aug30
on:
  push:
    paths:
      - 'dara_v12_1_aug30_phase_aware.py'
      - '.github/workflows/dara-v12-1-aug30-phase-aware.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backtest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python dara_v12_1_aug30_phase_aware.py
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/dara_v12_1_aug30_phase_aware.json
          git diff --cached --quiet || git commit -m "Persist DARA v12.1 Aug30 result"
          git pull --rebase origin main
          git push
