name: QuantBot v23 Bybit L2 Final Paper

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"

permissions:
  contents: write

concurrency:
  group: quantbot-v23-bybit-l2
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install websocket-client
      - name: Compile
        run: python -m py_compile research_v23_bybit_l2_final_paper.py
      - name: Run v23 forward L2 paper
        run: python research_v23_bybit_l2_final_paper.py
      - name: Persist state
        run: |
          git config user.name "quantbot-research-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/v23_bybit_l2_final_paper_state.json
          git diff --cached --quiet || git commit -m "Update QuantBot v23 Bybit L2 paper state"
          git push
