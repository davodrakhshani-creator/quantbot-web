name: QuantBot v24 Sep6 Locked Profit

on:
  push:
    paths:
      - 'research_v24_sep6_locked_profit.py'
      - '.github/workflows/quantbot-v24-sep6-locked-profit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install numpy pandas requests
      - name: Compile
        run: python -m py_compile research_v24_sep6_locked_profit.py
      - name: Run Sep 6 locked-profit test
        run: python research_v24_sep6_locked_profit.py
      - name: Persist state
        run: |
          git config user.name 'quantbot-research-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add data/v24_sep6_locked_profit_state.json
          git diff --cached --quiet || git commit -m 'Update Sep 6 locked-profit test state'
          git pull --rebase
          git push
