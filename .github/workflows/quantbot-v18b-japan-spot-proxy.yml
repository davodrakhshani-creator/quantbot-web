name: QuantBot v18B Japan Hybrid Spot Proxy [ARCHIVED]

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  paper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install requests
      - name: Compile
        run: python -m py_compile research_v18b_japan_spot_proxy.py
      - name: Run archived spot proxy
        run: python research_v18b_japan_spot_proxy.py
