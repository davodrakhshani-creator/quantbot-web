name: QuantBot v11 BTC Microburst Research
on:
  push:
    paths:
      - 'research_v11_microburst.py'
      - '.github/workflows/quantbot-v11-microburst.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  research:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install
        run: pip install numpy pandas requests
      - name: Compile
        run: python -m py_compile research_v11_microburst.py
      - name: Run v11 microburst research
        run: python research_v11_microburst.py
      - name: Persist state
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git pull --rebase origin main
          git add data/v11_microburst_state.json
          git diff --cached --quiet || git commit -m 'Update QuantBot v11 microburst state'
          git push
