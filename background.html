<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>QuantBot v1.3 Background Lab</title><style>:root{color-scheme:dark;--bg:#0b0d14;--card:#151925;--muted:#8f98ad;--green:#40e38c;--red:#ff5d73;--yellow:#ffd166;--blue:#6ea8fe}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#fff;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.w{max-width:760px;margin:auto;padding:24px 18px 60px}.top{display:flex;justify-content:space-between}.vtag{color:var(--blue);font-weight:900;font-size:20px}h1{font-size:32px;margin:0}.sub{color:var(--muted);margin-top:6px}.card{background:var(--card);border:1px solid #252b3b;border-radius:22px;padding:20px;margin-top:18px}.label{color:var(--muted);font-size:12px;font-weight:850}.big{font-size:38px;font-weight:950;margin-top:8px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}.stat{background:#10141e;padding:15px;border-radius:16px}.val{font-size:22px;font-weight:900;margin-top:5px}.green{color:var(--green)}.red{color:var(--red)}.yellow{color:var(--yellow)}.notice{margin-top:12px;padding:14px;border-radius:15px;background:#111521;color:#b5bdd0;border:1px solid #2a3040;line-height:1.5}.row{padding:11px 0;border-bottom:1px solid #282f3f}.row:last-child{border:0}button{width:100%;padding:14px;border:0;border-radius:14px;background:#202a40;color:#fff;font-weight:850;font-size:15px;margin-top:12px}</style></head><body><div class="w"><div class="top"><div><h1>QuantBot</h1><div class="sub">Background forward-research engine</div></div><div class="vtag">v1.3</div></div><div class="card"><div class="label">STATUS</div><div id="decision" class="big yellow">LOADING</div><div class="grid"><div class="stat"><div class="label">BTC</div><div id="btc" class="val">—</div></div><div class="stat"><div class="label">Last Update</div><div id="updated" class="val">—</div></div><div class="stat"><div class="label">Open Test</div><div id="open" class="val">NONE</div></div><div class="stat"><div class="label">Research Gate</div><div id="gate" class="val">COLLECTING</div></div></div><div id="reason" class="notice">Loading server-side state…</div><button onclick="load()">Refresh Results</button></div><div class="card"><div class="label">LATEST LAYERS</div><div class="grid"><div class="stat"><div class="label">Numerai</div><div id="num" class="val">—</div></div><div class="stat"><div class="label">Medium</div><div id="med" class="val">—</div></div><div class="stat"><div class="label">Micro</div><div id="mic" class="val">—</div></div><div class="stat"><div class="label">Confidence</div><div id="conf" class="val">—</div></div></div></div><div class="card"><div class="label">FORWARD RESULTS</div><div class="grid"><div class="stat"><div class="label">Closed</div><div id="closed" class="val">0</div></div><div class="stat"><div class="label">Win Rate</div><div id="wr" class="val">—</div></div><div class="stat"><div class="label">Avg Net</div><div id="avg" class="val">—</div></div><div class="stat"><div class="label">Profit Factor</div><div id="pf" class="val">—</div></div></div><div id="history" class="notice">No closed observations yet.</div></div></div><script>const $=x=>document.getElementById(x);const fmt=n=>n==null?'—':Number(n).toFixed(2);async function load(){try{const r=await fetch('data/v13_state.json?ts='+Date.now(),{cache:'no-store'});const s=await r.json(),l=s.latest||{},m=s.metrics||{};$('decision').textContent=l.decision||'WAIT';$('decision').className='big '+(l.decision==='LONG'?'green':l.decision==='SHORT'?'red':'yellow');$('btc').textContent=l.btc_price?'$'+Number(l.btc_price).toLocaleString():'—';$('updated').textContent=s.last_update?new Date(s.last_update).toLocaleString():'—';$('open').textContent=s.open_observation?s.open_observation.side:'NONE';$('gate').textContent=s.research_gate||'COLLECTING';$('reason').textContent=l.reason||'—';$('num').textContent=l.numerai_rank==null?'—':(l.numerai_rank*100).toFixed(1)+'th pct';$('med').textContent=(l.medium_bias||'—')+' '+fmt(l.medium_score);$('mic').textContent=(l.micro_bias||'—')+' '+fmt(l.micro_score);$('conf').textContent=(l.confidence??'—')+'%';$('closed').textContent=m.closed??0;$('wr').textContent=m.win_rate==null?'—':m.win_rate.toFixed(1)+'%';$('avg').textContent=m.avg_net_bps==null?'—':m.avg_net_bps.toFixed(1)+' bps';$('pf').textContent=m.profit_factor==null?'—':m.profit_factor.toFixed(2);const a=(s.closed_results||[]).slice(-8).reverse();$('history').innerHTML=a.length?a.map(x=>`<div class="row"><b class="${x.net_bps>0?'green':'red'}">${x.side} ${x.net_bps>0?'+':''}${x.net_bps.toFixed(1)} bps net</b><div style="color:#8f98ad;font-size:12px">${x.opened_at} → ${x.closed_at}</div></div>`).join(''):'No closed observations yet.'}catch(e){$('decision').textContent='STATE ERROR';$('reason').textContent=e.message}}load();setInterval(load,60000)</script></body></html>
